name: Validate data

# Runs on every push and pull request. No secrets or API keys needed.
on:
  push:
    paths: ["site/data/**", "tools/**"]
  pull_request:
    paths: ["site/data/**", "tools/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/validate.mjs
